name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            quality: false
          - os: ubuntu-latest
            python-version: "3.12"
            quality: false
          - os: ubuntu-latest
            python-version: "3.14"
            quality: true
          - os: windows-latest
            python-version: "3.12"
            quality: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Subversion for integration test
        if: matrix.quality && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes subversion

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,release]"

      - name: Lint
        if: matrix.quality
        run: python -m ruff check src tests scripts

      - name: Type check
        if: matrix.quality
        run: python -m mypy src scripts

      - name: Test
        run: python -m pytest -q

      - name: Build and validate package
        if: matrix.quality
        run: python scripts/release_pypi.py --skip-checks
